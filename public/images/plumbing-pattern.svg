<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" fill="none">
  <defs>
    <pattern id="plumb" width="180" height="140" patternUnits="userSpaceOnUse">
      <rect width="180" height="140" fill="#ffffff"/>

      <g stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9">
        <!-- Shower head -->
        <path d="M18 24 h24"/>
        <path d="M30 24 v12"/>
        <path d="M30 36 a8 8 0 0 0 8 8"/>
        <path d="M38 44 h12"/>
        <path d="M42 52 v6"/>
        <path d="M48 52 v6"/>

        <!-- Pipe elbow -->
        <path d="M94 18 h18"/>
        <path d="M112 18 v18"/>
        <circle cx="94" cy="18" r="2" fill="#6b7280"/>
        <circle cx="112" cy="36" r="2" fill="#6b7280"/>

        <!-- Valve -->
        <rect x="140" y="20" width="24" height="12" rx="3"/>
        <path d="M152 14 v24"/>
        <path d="M146 20 l12 12"/>
        <path d="M158 20 l-12 12"/>

        <!-- Bathtub -->
        <path d="M18 98 h64"/>
        <path d="M22 98 c0 14 8 20 28 20 c20 0 28-6 28-20"/>
        <path d="M28 120 v8"/>
        <path d="M72 120 v8"/>

        <!-- Radiator -->
        <rect x="98" y="88" width="58" height="34" rx="4"/>
        <path d="M108 88 v34"/>
        <path d="M118 88 v34"/>
        <path d="M128 88 v34"/>
        <path d="M138 88 v34"/>

        <!-- Pressure gauge -->
        <circle cx="46" cy="62" r="10"/>
        <path d="M46 62 l5 -3"/>

        <!-- Faucet -->
        <path d="M122 64 h28"/>
        <path d="M136 56 v16"/>
        <path d="M150 64 v8"/>
        <path d="M150 72 c0 4 -3 7 -7 7"/>

        <!-- Pipe stacks -->
        <rect x="150" y="98" width="20" height="8" rx="4"/>
        <rect x="150" y="110" width="20" height="8" rx="4"/>

        <!-- Sink -->
        <path d="M70 10 h18"/>
        <path d="M78 10 v10"/>
        <path d="M74 20 h8"/>
      </g>

      <!-- Bubbles / dots -->
      <g stroke="#9ca3af" stroke-width="1.5" fill="none" opacity="0.9">
        <circle cx="16" cy="70" r="4"/>
        <circle cx="62" cy="74" r="3"/>
        <circle cx="168" cy="68" r="4"/>
        <circle cx="84" cy="126" r="3"/>
        <circle cx="172" cy="126" r="3"/>
      </g>
    </pattern>
  </defs>

  <rect width="900" height="420" fill="url(#plumb)"/>
</svg>
